<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pricing cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg-top">
      <img src="./images/bg-top.svg" />
    </div>
    <div id="BG-bottom">
      <img src="./images/bg-bottom.svg" />
    </div>
    <div class="pricing">
      <h1>our pricing</h1>
      <div class="switch-area">
        <span>Anually</span>
        <label class="switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
        <span>Monthly</span>
      </div>
    </div>
    <div class="pricing-cards">
      <div class="Basic">
        <h3>Basic</h3>
        <h1>19.99$</h1>
        <br />
        <hr />
        <p>500GB Storage</p>
        <hr />
        <p>2 Users Allowed</p>
        <hr />
        <p>Send up to 3GB</p>
        <hr />
        <button>Learn More</button>
      </div>
      <div class="Professional">
        <h3>Professional</h3>
        <h1>24.99$</h1>
        <br />
        <hr />
        <p>1TB Storage</p>
        <hr />
        <p>5 Users Allowed</p>
        <hr />
        <p>Send up to 10GB</p>
        <hr />
        <button>Learn More</button>
      </div>
      <div class="Master">
        <h3>Master</h3>
        <h1>39.99$</h1>
        <br />
        <hr />
        <p>2TB Storage</p>
        <hr />
        <p>10 Users Allowed</p>
        <hr />
        <p>Send up to 20GB</p>
        <hr />
        <button>Learn More</button>
      </div>
    </div>
  </body>
</html>
